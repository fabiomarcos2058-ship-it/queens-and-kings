<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .asa-e { transform-origin: 78px 92px; animation: bate 1.6s ease-in-out infinite; }
    .asa-d { transform-origin: 122px 92px; animation: bateD 1.6s ease-in-out infinite; }
    @keyframes bate { 0%, 100% { transform: rotate(0deg) scaleX(1); } 50% { transform: rotate(-14deg) scaleX(0.82); } }
    @keyframes bateD { 0%, 100% { transform: rotate(0deg) scaleX(1); } 50% { transform: rotate(14deg) scaleX(0.82); } }
    .fogo { transform-origin: 100px 150px; animation: chama 0.42s ease-in-out infinite alternate; }
    .fogo2 { transform-origin: 100px 150px; animation: chama2 0.55s ease-in-out infinite alternate; }
    @keyframes chama { from { transform: scale(1, 1) skewX(-3deg); } to { transform: scale(1.06, 1.12) skewX(3deg); } }
    @keyframes chama2 { from { transform: scale(1.05, 1.08) skewX(4deg); opacity: .85; } to { transform: scale(0.96, 0.96) skewX(-4deg); opacity: 1; } }
    .brilho { animation: pisca 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pisca { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1.1) rotate(45deg); } 70% { opacity: 0; } }
    .gema { animation: gema 1.4s ease-in-out infinite alternate; }
    @keyframes gema { from { opacity: .75; } to { opacity: 1; } }
    .faisca { animation: sobe 1.6s linear infinite; }
    @keyframes sobe { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="asa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B4E4A"/><stop offset=".6" stop-color="#021C1A"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="membrana" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19CECA"/><stop offset="1" stop-color="#003D38"/></linearGradient>
    <linearGradient id="f1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0FACFF"/><stop offset=".45" stop-color="#2B80FF"/><stop offset=".8" stop-color="#7381FF"/><stop offset="1" stop-color="#DCDBFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4D73FF"/><stop offset=".6" stop-color="#CBCAFF"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C1C6FF"/><stop offset=".35" stop-color="#2542E9"/><stop offset=".6" stop-color="#003070"/><stop offset=".85" stop-color="#5E77FF"/><stop offset="1" stop-color="#002D81"/></linearGradient>
    <radialGradient id="nucleo" cx=".45" cy=".4" r=".65"><stop offset="0" stop-color="#DCDBFF"/><stop offset=".3" stop-color="#2B80FF"/><stop offset=".7" stop-color="#00CEC6"/><stop offset="1" stop-color="#003D38"/></radialGradient>
    <radialGradient id="aura" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#2BACFF" stop-opacity=".75"/><stop offset=".6" stop-color="#3CFFF4" stop-opacity=".25"/><stop offset="1" stop-color="#3CFFF4" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="100" cy="108" r="92" fill="url(#aura)"/>
  <!-- asas de demônio -->
  <g class="asa-e">
    <path d="M80 92 C60 60 30 40 6 42 C18 52 22 60 20 70 C30 66 36 70 38 78 C26 80 18 92 16 104 C28 98 38 100 44 108 C40 116 42 124 46 130 C56 116 70 106 84 104 Z" fill="url(#membrana)" stroke="#021C1A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 92 C60 60 30 40 6 42 M80 96 L20 70 M82 100 L16 104 M84 104 L46 130" stroke="url(#asa)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g class="asa-d">
    <path d="M120 92 C140 60 170 40 194 42 C182 52 178 60 180 70 C170 66 164 70 162 78 C174 80 182 92 184 104 C172 98 162 100 156 108 C160 116 158 124 154 130 C144 116 130 106 116 104 Z" fill="url(#membrana)" stroke="#021C1A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120 92 C140 60 170 40 194 42 M120 96 L180 70 M118 100 L184 104 M116 104 L154 130" stroke="url(#asa)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- fogo atrás -->
  <path class="fogo" d="M100 160 C60 158 46 128 58 100 C62 116 70 118 72 112 C66 92 76 66 96 52 C92 72 104 80 108 74 C112 62 108 46 104 34 C128 50 140 76 134 102 C140 98 144 90 146 84 C158 110 146 158 100 160 Z" fill="url(#f1)"/>
  <path class="fogo2" d="M100 156 C76 154 68 136 74 118 C80 126 84 126 84 120 C82 104 90 92 100 82 C100 96 108 100 112 94 C122 108 128 126 120 140 C126 138 128 134 130 130 C132 148 118 156 100 156 Z" fill="url(#f2)"/>
  <!-- brasão -->
  <path d="M100 76 L136 92 L132 134 L100 162 L68 134 L64 92 Z" fill="#021510" stroke="url(#metal)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M100 86 L127 98 L124 130 L100 151 L76 130 L73 98 Z" fill="none" stroke="#2BACFF" stroke-width="1.6" stroke-opacity=".8"/>
  <!-- chifres / coroa -->
  <path d="M74 94 C66 80 64 66 70 54 C74 66 80 74 88 82 Z" fill="url(#metal)" stroke="#00162D" stroke-width="2"/>
  <path d="M126 94 C134 80 136 66 130 54 C126 66 120 74 112 82 Z" fill="url(#metal)" stroke="#00162D" stroke-width="2"/>
  <path d="M84 84 L88 66 L95 76 L100 60 L105 76 L112 66 L116 84 Z" fill="url(#metal)" stroke="#00162D" stroke-width="2" stroke-linejoin="round"/>
  <!-- núcleo de aura -->
  <circle class="gema" cx="100" cy="118" r="17" fill="url(#nucleo)" stroke="#00162D" stroke-width="2.5"/>
  <path d="M100 103 L104 114 L115 118 L104 122 L100 133 L96 122 L85 118 L96 114 Z" fill="#DCDBFF" opacity=".9"/>
  <!-- brilhos dentro e em volta -->
  <g fill="#DCDBFF">
    <path class="brilho" style="animation-delay:0s" d="M100 112 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z"/>
    <path class="brilho" style="animation-delay:.5s" d="M84 132 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5z"/>
    <path class="brilho" style="animation-delay:1.1s" d="M116 104 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5z"/>
    <path class="brilho" style="animation-delay:.3s" d="M30 130 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3z"/>
    <path class="brilho" style="animation-delay:.9s" d="M170 128 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3z"/>
    <path class="brilho" style="animation-delay:1.4s" d="M100 20 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3z"/>
    <path class="brilho" style="animation-delay:.7s" d="M150 30 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z"/>
    <path class="brilho" style="animation-delay:1.2s" d="M48 28 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z"/>
  </g>
  <g fill="#4D73FF">
    <circle class="faisca" style="animation-delay:0s" cx="80" cy="160" r="2.2"/>
    <circle class="faisca" style="animation-delay:.6s" cx="120" cy="164" r="2"/>
    <circle class="faisca" style="animation-delay:1.1s" cx="100" cy="170" r="2.5"/>
    <circle class="faisca" style="animation-delay:.3s" cx="62" cy="150" r="1.6"/>
    <circle class="faisca" style="animation-delay:.9s" cx="138" cy="150" r="1.6"/>
  </g>
<g class="gema"><ellipse cx="100" cy="22" rx="30" ry="8" fill="none" stroke="#FFF6C0" stroke-width="4"/><ellipse cx="100" cy="22" rx="30" ry="8" fill="none" stroke="#FFD25E" stroke-width="1.5"/></g></svg>
